# medusa custom rules v1
# These rules cover the TTPs generated in the vulnerable target host
# NOTE: falco_rules.yaml is NOT loaded (requires container plugin >= 0.4.0).
#       Rules use raw evt.type conditions instead of high-level macros.

- list: medusa_sensitive_files
  items:
    - /etc/shadow
    - /etc/passwd
    - /root/.ssh/id_rsa
    - /root/.bash_history
    - /proc/1/environ

- rule: medusa Shell Spawned
  desc: Shell executed inside or outside a container (possible RCE)
  condition: >
    evt.type = execve
    and proc.name in (bash, sh, zsh, dash)
  output: >
    Shell executed
    (user=%user.name proc=%proc.name parent=%proc.pname cmd=%proc.cmdline)
  priority: CRITICAL
  tags: [medusa, T1059, execution]

- rule: medusa Sensitive File Read
  desc: Sensitive system file opened for reading
  condition: >
    evt.type in (open, openat)
    and fd.name in (medusa_sensitive_files)
  output: >
    Sensitive file read
    (user=%user.name file=%fd.name proc=%proc.name cmd=%proc.cmdline)
  priority: ERROR
  tags: [medusa, T1005, collection]

- rule: medusa SSH Connection
  desc: Inbound SSH connection detected
  condition: >
    evt.type = accept
    and fd.sport = 22
  output: >
    SSH connection detected
    (src=%fd.sip proc=%proc.name)
  priority: WARNING
  tags: [medusa, T1110, credential-access]