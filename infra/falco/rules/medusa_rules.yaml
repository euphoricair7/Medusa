# medusa custom rules v1
# These rules cover the TTPs generated in the vulnerable target host
# NOTE: falco_rules.yaml NOT loaded (requires container plugin >= 0.4.0, not in plain image).
#       All container.* fields are plugin-owned and unavailable without it.
#       Rules use raw evt.type conditions instead of high-level macros.

- list: medusa_sensitive_files
  items:
    - /etc/shadow
    - /etc/passwd
    - /root/.ssh/id_rsa
    - /root/.bash_history
    - /proc/1/environ

- rule: medusa Shell Spawned in Container
  desc: A shell was spawned inside a container — possible RCE
  condition: >
    evt.type = execve
    and proc.name in (bash, sh, zsh, dash)
  output: >
    Shell spawned in container
    (user=%user.name proc=%proc.name parent=%proc.pname cmd=%proc.cmdline)
  priority: CRITICAL
  tags: [medusa, T1059, execution]

- rule: medusa Sensitive File Read
  desc: Sensitive system file read
  condition: >
    evt.type in (open, openat)
    and fd.name in (medusa_sensitive_files)
  output: >
    Sensitive file opened for reading
    (user=%user.name file=%fd.name proc=%proc.name cmd=%proc.cmdline)
  priority: ERROR
  tags: [medusa, T1005, collection]

- rule: medusa SSH Brute Force
  desc: Multiple failed SSH authentication attempts
  condition: >
    evt.type = accept
    and fd.sport = 22
  output: >
    SSH connection to target (src=%fd.sip proc=%proc.name)
  priority: WARNING
  tags: [medusa, T1110, credential-access]

