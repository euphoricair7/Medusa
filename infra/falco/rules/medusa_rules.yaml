# medusa custom rules — requires container plugin (load_plugins: [container])
# Docker Compose target: container.* fields only
# K8s pods (with CRI engine): also k8s.ns.name, k8s.pod.name in output_fields

- list: medusa_lab_ignore
  items:
    - medusa-postgres
    - medusa-api
    - medusa-falco

- list: medusa_cluster_ignore_ns
  items:
    - kube-system
    - kube-public
    - falco

- macro: medusa_ignore_pod
  condition: (k8s.pod.name startswith "checksum-helper")

- macro: medusa_lab_noise
  condition: >
    (container.name in (medusa_lab_ignore))
      or medusa_ignore_pod

- macro: k8s_workload
  condition: (k8s.pod.name exists)


- list: medusa_sensitive_files
  items:
    - /etc/shadow
    - /etc/passwd
    - /root/.ssh/id_rsa
    - /root/.bash_history
    - /proc/1/environ

- rule: medusa Shell Spawned in Container
  desc: A shell was spawned inside a container — possible RCE
  condition: >
    spawned_process
    and container
    and proc.name in (bash, sh, zsh, dash)
    and not medusa_lab_noise
    and k8s_workload
  output: >
    Shell spawned in container
    (k8s.ns.name=%k8s.ns.name k8s.pod.name=%k8s.pod.name
     container.name=%container.name container.id=%container.id
     container.image=%container.image.repository
     user=%user.name parent=%proc.pname cmd=%proc.cmdline)
  priority: CRITICAL
  tags: [medusa, T1059, execution]

- rule: medusa Sensitive File Read
  desc: Sensitive system file read inside a container
  condition: >
    evt.type in (open, openat, openat2)
    and evt.is_open_read=true
    and container
    and fd.name in (medusa_sensitive_files)
    and not medusa_lab_noise
    and k8s_workload
  output: >
    Sensitive file opened for reading
    (k8s.ns.name=%k8s.ns.name k8s.pod.name=%k8s.pod.name
     container.name=%container.name container.id=%container.id
     user=%user.name file=%fd.name proc=%proc.name cmd=%proc.cmdline)
  priority: ERROR
  tags: [medusa, T1005, collection]

- rule: medusa SSH Brute Force
  desc: Inbound SSH connection to container port 22
  condition: >
    evt.type = accept
    and container
    and fd.sport = 22
    and not medusa_lab_noise
    and k8s_workload
  output: >
    SSH connection to container
    (k8s.ns.name=%k8s.ns.name k8s.pod.name=%k8s.pod.name
     container.name=%container.name src=%fd.sip proc=%proc.name)
  priority: WARNING
  tags: [medusa, T1110, credential-access]