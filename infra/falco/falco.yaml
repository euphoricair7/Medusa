# Falco config — RAFT v1
# Manda tutti gli alert all'API via HTTP webhook

engine:
  kind: ebpf

# Webhook verso FastAPI
http_output:
  enabled: true
  url: http://api:8000/alerts/falco

stdout_output:
  enabled: true

json_output: true
json_include_output_property: true
json_include_tags_property: true

priority: debug

rules_file:
  - /etc/falco/falco_rules.yaml       
  - /etc/falco/rules.d/medusa_rules.yaml

plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false
      engines:
        docker:
          enabled: true
          sockets: 
            - /host/var/run/docker.sock  
        podman:
          enabled: false
        containerd:
          enabled: true
          sockets:
            - /run/containerd/containerd.sock  
        cri:
          enabled: true
          sockets:
            - /run/containerd/containerd.sock 
        lxc:
          enabled: false
        libvirt_lxc:
          enabled: false
        bpm:
          enabled: false

load_plugins: [container]