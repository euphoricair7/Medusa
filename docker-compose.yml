name: medusa-v1

services:

  # Target — vulnerable
  target:
    build:
      context: ./services/target
    container_name: medusa-target
    hostname: target
    networks:
      - lab-net
    ports:
      - "8080:8080"
      - "${TARGET_SSH_PORT:-2222}:22"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  # Falco — monitoring syscall on the target
  falco:
    image: falcosecurity/falco:0.44.1
    container_name: medusa-falco
    hostname: falco
    privileged: true
    pid: host
    security_opt:
      - seccomp:unconfined  # allows eBPF syscalls
      - label:disable       # Fedora/SELinux — ignored on Ubuntu
    command: falco -o engine.kind=modern_ebpf
    networks:
      - lab-net
      - internal-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - ./infra/falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./infra/falco/rules:/etc/falco/rules.d:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    depends_on:
      - target
      - api
    restart: unless-stopped

  # API: FastAPI gets the Falco alerts and it saves them on postgres
  api:
    build:
      context: ./services/api
    container_name: medusa-api
    hostname: api
    networks:
      - lab-net
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://medusa:${POSTGRES_PASSWORD:-medusa}@postgres:5432/medusa
      - KUBECONFIG_PATH=/kube/config
      - K8S_IN_CLUSTER=false
      - CHECKPOINT_HOST_PATH=/checkpoints
      - CHECKPOINT_HOST_PREFIX=/var/lib/kubelet/checkpoints
    volumes:
      - ${HOME}/.kube/config:/kube/config:ro
      - /var/lib/kubelet/checkpoints:/checkpoints:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    hostname: postgres
    networks:
      - lab-net
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=medusa
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medusa}
      - POSTGRES_DB=medusa
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  lab-net:
    name: medusa-lab-net
    driver: bridge
  internal-net:
    name: medusa-internal-net
    driver: bridge
    internal: true

volumes:
  postgres-data:
